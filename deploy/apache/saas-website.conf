# Host Apache vhost - public port 7002 ➞ Docker website backends 7011 + 7015

<VirtualHost *:7002>


    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy balancer://saas-website>
        BalancerMember http://127.0.0.1:7011 route=web1
        BalancerMember http://127.0.0.1:7015 route=web2
        ProxySet lbmethod=byrequests
    </Proxy>

    ProxyPass / balancer://saas-website/
    ProxyPassReverse / balancer://saas-website/

    ErrorLog ${APACHE_LOG_DIR}/saas-website-error.log
    CustomLog ${APACHE_LOG_DIR}/saas-website-access.log combined
</VirtualHost>

# Single-replica mode (REPLICAS=1):
# ProxyPass / http://127.0.0.1:7011/
# ProxyPassReverse / http://127.0.0.1:7011/
